name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@v5
        id: cache-go-tools
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('go.mod', '.github/workflows/test.yml') }}-${{ steps.setup-go.outputs.go-version }}

      - if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/gopls@v0.23.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - run: go vet ./...
      - run: staticcheck ./...
      - run: find . -type f -name "*.go" -print0 | xargs -0 -n 100 gopls check -severity=hint
      - run: govulncheck ./...

      - run: go test ./... -coverprofile=coverage.out

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
