name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL and NATS (JetStream) for the live tests (see
    # internal/livetest). Password auth (scram-sha-256, the image default when a
    # password is set) exercises the real login path, including rejected logins.
    # The containers are ephemeral.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      nats:
        image: nats:2.11-alpine
        # -js enables JetStream, which the stream tests need; -m exposes the
        # monitoring endpoint that the health check polls.
        command: -js -m 8222
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8222/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    # The live tests skip unless these are set (see internal/livetest).
    env:
      BASE_TEST_DATABASE_URL: postgres://postgres:fixture-password@127.0.0.1:5432/postgres?sslmode=disable
      BASE_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@v5

      # Caches the module cache and the build cache. Dev tools are pinned in
      # _tools/go.mod and run with `go tool`; their binaries live in the
      # build cache, keyed by both go.sum files and the Go version.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # go.mod's toolchain line pins the patch release. setup-go reads it;
          # when its version manifest lags, setup-go downloads that release from
          # go.dev. Bump the toolchain line with each Go patch release. The go
          # line stays at the minor series so consumers' minimum does not move.
          cache: true
          cache-dependency-path: |
            go.sum
            _tools/go.sum

      # base is a library with no Makefile: each step below is the command to
      # run locally. The tool commands use `go tool -modfile=_tools/go.mod`
      # so local runs and CI use identical versions (see _tools/go.mod
      # before bumping them).
      - name: Check formatting
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "$out"; echo "gofmt: files need formatting (above); run gofmt -s -w ."; exit 1; fi

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          go -C _tools mod tidy
          go -C _tools build tool
          git diff --exit-code -- go.mod go.sum _tools/go.mod _tools/go.sum || { echo "go mod tidy changed module files; commit the result"; exit 1; }

      - run: go test ./... -count=1 -race -coverprofile=coverage.out

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

      - run: go vet ./...
      - run: go tool -modfile=_tools/go.mod staticcheck -checks all ./...
      - run: find . -type f -name "*.go" -print0 | xargs -0 -n 100 go tool -modfile=_tools/go.mod gopls check -severity=hint
      - run: go tool -modfile=_tools/go.mod govulncheck ./...
